name: build-and-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Verify dependency checksums
        run: go mod download && go mod verify
      - name: Install offline RF replay test dependency
        run: sudo apt-get update && sudo apt-get install -y rtl-433
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test race safety and static analysis
        run: make check
      - name: Build native executable
        run: make build
      - name: Smoke check binary
        run: bin/rf-button-manager --version
